// each room starts at a random spot and jumps by 7919 (coprime with the list size), so no question repeats until the whole list is used
const QN=1000000,STEP=7919;
const qAt=(mode,start,n)=>{const L=Q[mode];return L[(start+n*STEP)%L.length]};

// ---------- helpers ----------
const $=s=>document.querySelector(s), app=$("#app");
const CH="ABCDEFGHJKLMNPQRSTUVWXYZ23456789", EMS=Array.from("😀😎🤪😈🥳🤠👻🦄🐸🐵🍕🔥💀🤡🦖🐙");
let db=null,code="",room=undefined,players=[],votes=[],me={id:"",name:"",emoji:"😎"},screen="home",msg="",unsubs=[],joinedOk=false;
try{me.id=sessionStorage.getItem("pid")||""}catch(e){}
if(!me.id){me.id=Math.random().toString(36).slice(2,10);try{sessionStorage.setItem("pid",me.id)}catch(e){}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P=id=>players.find(p=>p.id===id)||{name:"?",emoji:"❔",id};
const rd=()=>db.doc("rooms/"+code), pc=()=>db.collection("rooms/"+code+"/p"), vc=()=>db.collection("rooms/"+code+"/v");
const hdr=()=>`<div class="top"><span class="logo">WHO WOULD?!</span>${code?`<span class="pill">${code}</span>`:""}</div>`;
const err=()=>msg?`<div class="err">${esc(msg)}</div>`:"";
const go=s=>{screen=s;render()};
const fail=e=>{msg=(e&&e.message)||"Something went wrong. Check your connection / permissions.";render()};

// ---------- room logic ----------
async function createRoom(mode){
  for(let i=0;i<5;i++){
    code=Array.from({length:5},()=>CH[Math.random()*CH.length|0]).join("");
    const s=await rd().get(); if(!s.exists) break;
  }
  await rd().set({mode,host:me.id,phase:"lobby",asker:"",q:"",n:0,round:0,start:Math.random()*QN|0});
  go("profile");
}
async function joinRoom(c){
  code=c.trim().toUpperCase();
  const s=await rd().get();
  if(!s.exists){msg="No room with that ID. Check and try again.";code="";return render()}
  msg="";go("profile");
}
async function enter(){
  if(!me.name.trim()){msg="Type your name first!";return render()}
  const prof={id:me.id,name:me.name.trim().slice(0,14),emoji:me.emoji,t:Date.now()};
  if(db.join){db.join(code,me.id);db.rejoin=()=>pc().doc(me.id).set(prof)}
  await pc().doc(me.id).set(prof);
  listen(); go("game");
}
function listen(){
  room=undefined;
  unsubs.forEach(u=>u());unsubs=[];
  unsubs.push(rd().onSnapshot(s=>{room=s.exists?s.data():null;render()},fail));
  unsubs.push(pc().onSnapshot(s=>{players=s.docs.map(d=>d.data()).sort((a,b)=>a.t-b.t);render()},fail));
  unsubs.push(vc().onSnapshot(s=>{votes=s.docs.map(d=>d.data());render()},fail));
}
const nextQ=(n)=>qAt(room.mode,room.start,n);
async function startGame(){await rd().update({phase:"vote",asker:room.host,n:1,round:1,q:nextQ(0)})}
async function vote(to){await vc().doc(me.id).set({id:me.id,to,round:room.round})}
let revealedRound=0;function revealMine(){revealedRound=room.round;render()}
async function passTo(id){await rd().update({asker:id,phase:"vote",q:nextQ(room.n),n:room.n+1,round:room.round+1})}

// ---------- views ----------
function render(){
  if(!db){app.innerHTML=hdr()+`<div class="panel"><h2>Loading…</h2><p class="sm">If this never finishes, open the link while signed in to Claude with Contributor access.</p></div>`;return}
  let h=hdr();
  if(screen==="home") h+=`<div class="panel"><div class="big0">🃏</div><h1>Expose your friends!</h1><p>Who would…? Let the pointing begin.</p>${err()}<button onclick="go('mode')">➕ Create new game</button><button class="alt" onclick="go('join')">🔑 Join game</button></div>`;
  else if(screen==="mode") h+=`<div class="panel"><h2>Who's playing?</h2>${err()}<button class="go" onclick="createRoom('family').catch(fail)">👨‍👩‍👧 Play with family</button><button onclick="createRoom('friends').catch(fail)">🍻 Play with friends (18+)</button><button class="alt" onclick="go('home')">← Back</button></div>`;
  else if(screen==="join") h+=`<div class="panel"><h2>Enter room ID</h2><input id="cin" class="code" maxlength="5" placeholder="•••••" autocomplete="off">${err()}<button class="go" onclick="joinRoom($('#cin').value).catch(fail)">Enter room</button><button class="alt" onclick="go('home')">← Back</button></div>`;
  else if(screen==="profile") h+=`<div class="panel"><h2>Who are you?</h2><input id="nm" maxlength="14" placeholder="Your name" value="${esc(me.name)}" oninput="me.name=this.value"><p class="sm">Pick your emoji</p><div class="grid">${EMS.map(e=>`<button class="em ${e===me.emoji?"sel":""}" onclick="me.emoji='${e}';render()">${e}</button>`).join("")}</div>${err()}<button class="go" onclick="enter().catch(fail)">Join the room</button></div>`;
  else h+=game();
  const f=document.activeElement&&document.activeElement.id, v=f&&document.activeElement.value;
  app.innerHTML=h; if(f&&$("#"+f)){$("#"+f).value=v;$("#"+f).focus()}
}
function game(){
  if(room===undefined) return `<div class="panel"><h2 class="center">Joining…</h2></div>`;
  if(!room) return `<div class="panel"><h2>Room closed</h2><button onclick="location.reload()">Home</button></div>`;
  const host=room.host===me.id, asker=room.asker===me.id, tag=room.mode==="family"?"👨‍👩‍👧 FAMILY":"🍻 FRIENDS 18+";
  const roster=players.map(p=>`<div class="row"><span class="big">${p.emoji}</span><b>${esc(p.name)}</b>${p.id===room.host?'<span class="badge">HOST</span>':""}</div>`).join("");
  if(room.phase==="lobby") return `<div class="panel"><span class="tag">${tag}</span><h2>Room ${code}</h2><p>Friends join with this ID. Anyone can hop in – no limit.</p>${roster}<p class="sm center">${players.length} player${players.length==1?"":"s"} in</p>${host?`<button class="go" ${players.length<2?"disabled":""} onclick="startGame().catch(fail)">▶ Start game</button>`:`<p class="center">Waiting for the host to start…</p>`}</div>`;
  const cur=votes.filter(v=>v.round===room.round), mine=cur.find(v=>v.id===me.id), ak=P(room.asker);
  const qbox=`<span class="tag">${tag} · Q${room.n}</span><div class="q">${esc(room.q)}</div>`;
  const shown=revealedRound===room.round&&mine;
  const pick=(fn)=>`<div class="opts">${players.filter(p=>fn==="vote"||p.id!==me.id).map(p=>`<button class="opt alt" onclick="${fn}('${p.id}').catch(fail)"><span>${p.emoji}</span><i class="nm">${esc(p.name)}</i></button>`).join("")}</div>`;
  let body;
  if(!mine) body=`<p>${asker?"You're reading it out loud 🎤":ak.emoji+" "+esc(ak.name)+" is reading it out."} Pick one:</p>${pick("vote")}`;
  else if(!shown) body=`<div class="big0">🔒</div><h2 class="center">Locked in!</h2><p class="center">Face down your phone. ${cur.length}/${players.length} voted.</p><button class="go" onclick="revealMine()">👀 Reveal</button>`;
  else{const t=P(mine.to);body=`<p class="center">Your pick:</p><div class="pick"><span>${t.emoji}</span><b>${esc(t.name)}</b></div>${asker?`<p>Pass the question to:</p>${pick("passTo")}`:`<p class="sm center">Waiting for ${esc(ak.name)} to pass the question…</p>`}`}
  return `<div class="panel">${qbox}${body}</div>`;
}

// ---------- local test mode (no Claude): syncs between tabs of the same browser ----------
function localDb(){
 const L=new Set(),ping=()=>L.forEach(f=>f());addEventListener("storage",ping);
 const rdp=p=>{try{return JSON.parse(localStorage.getItem("ld:"+p))}catch(e){return null}};
 const snap=p=>{const d=rdp(p);return{exists:!!d,data:()=>d||undefined}};
 const doc=p=>({get:async()=>snap(p),set:async d=>{localStorage.setItem("ld:"+p,JSON.stringify(d));ping()},update:async d=>{localStorage.setItem("ld:"+p,JSON.stringify({...rdp(p),...d}));ping()},onSnapshot:n=>{const f=()=>n(snap(p));L.add(f);setTimeout(f);return()=>L.delete(f)}});
 const col=p=>({doc:id=>doc(p+"/"+id),onSnapshot:n=>{const f=()=>n({docs:Object.keys(localStorage).filter(k=>k.startsWith("ld:"+p+"/")&&k.slice(p.length+4).indexOf("/")<0).map(k=>({data:()=>JSON.parse(localStorage.getItem(k))}))});L.add(f);setTimeout(f);return()=>L.delete(f)}});
 return{doc,collection:col};
}
// ---------- online mode: talks to server.js over WebSocket ----------
function netDb(){
 const url=(location.protocol==="https:"?"wss://":"ws://")+location.host;
 let ws,q=[],n=0,first=true,who=null;const cb={},subs={};
 const send=o=>{const m=JSON.stringify(o);ws.readyState===1?ws.send(m):q.push(m)};
 const open=()=>{ws=new WebSocket(url);
  ws.onopen=()=>{if(who)ws.send(JSON.stringify({op:"join",code:who.c,id:who.i}));Object.entries(subs).forEach(([id,s])=>ws.send(JSON.stringify({op:"sub",id,...s})));q.splice(0).forEach(m=>ws.send(m));if(!first&&api.rejoin)api.rejoin();first=false};
  ws.onmessage=e=>{const x=JSON.parse(e.data),f=cb[x.sub||x.id];if(!f)return;const s=x.snap;
   f(s.docs?{docs:s.docs.map(d=>({data:()=>d.data}))}:{exists:s.exists,data:()=>s.data})};
  ws.onclose=()=>setTimeout(open,1000)};
 open();
 const doc=p=>({get:()=>new Promise(r=>{const id="g"+ ++n;cb[id]=s=>{delete cb[id];r(s)};send({op:"get",id,path:p})}),
  set:async d=>send({op:"set",path:p,data:d}),update:async d=>send({op:"update",path:p,data:d}),
  onSnapshot:f=>{const id="s"+ ++n;cb[id]=f;subs[id]={path:p,kind:"doc"};if(ws.readyState===1)ws.send(JSON.stringify({op:"sub",id,...subs[id]}));return()=>{delete cb[id];delete subs[id]}}});
 const col=p=>({doc:i=>doc(p+"/"+i),onSnapshot:f=>{const id="s"+ ++n;cb[id]=f;subs[id]={path:p,kind:"col"};if(ws.readyState===1)ws.send(JSON.stringify({op:"sub",id,...subs[id]}));return()=>{delete cb[id];delete subs[id]}}});
 const api={doc,collection:col,join:(c,i)=>{who={c,i};send({op:"join",code:c,id:i})}};
 return api;
}
// ---------- boot ----------
render();
(async()=>{
  try{const c=(typeof claude==="undefined")?(location.protocol==="file:"?localDb():netDb()):await claude.use("db");if(!c){app.innerHTML=hdr()+`<div class="panel"><h2>Sign in needed</h2><p>Open this link signed in to Claude, with Contributor access, so everyone's phones can share the room.</p></div>`;return}db=c}catch(e){return}
  render();
})();
